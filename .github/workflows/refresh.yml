name: Winterdienst Wetterdaten
on:
  schedule:
    - cron: '12 0,3,6,9,12,15,18,21 * * *'
      timezone: 'Europe/Zurich'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: winterdienst-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wetterdaten aktualisieren
        run: python scripts/update_weather.py
      - name: Änderungen speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weather-data.json
          git diff --cached --quiet || (git commit -m 'Wetterdaten aktualisiert' && git push)
